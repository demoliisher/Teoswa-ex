<html lang="zh-Hant" data-loading>
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>潮汕制霸 - 潮汕地區制霸標記生成器</title>
<meta name="description" content="以行政區為單位標記「居住、短居、遊玩、出差、路過」，生成專屬潮汕制霸圖。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="topbar">
    <div class="tb-main">
        <span class="tb-title"></span>
        <span class="tb-sub"></span>
        <span id="score-top"></span>
    </div>
</div>
<!-- station hover: radar lock ring (pure CSS overlay, positioned at the marker's
     screen point) + the note card. Both live outside the SVG so the PNG export
     never picks them up. -->
<div id="site-lock" hidden>
    <span class="sl-ring"></span>
    <span class="sl-sweep"></span>
    <span class="sl-cross"></span>
    <span class="sl-br tl"></span><span class="sl-br tr"></span>
    <span class="sl-br bl"></span><span class="sl-br br"></span>
</div>
<div id="site-note" hidden>
    <div class="sn-head"></div>
    <div class="sn-body"></div>
    <div class="sn-foot"></div>
</div>
<div id="level-popup" hidden>
    <h2></h2>
    <a data-level="5">居住</a>
    <a data-level="4">短居</a>
    <a data-level="3">遊玩</a>
    <a data-level="2">出差</a>
    <a data-level="1">路過</a>
    <a data-level="0">沒去過</a>
</div>
<div id="legend-drawer">
    <a class="drawer-bar" role="button" aria-expanded="false">
        <span class="drawer-label">控制面板</span>
        <svg class="chev" aria-hidden="true" viewBox="0 0 16 16" width="13" height="13" fill="currentColor"><path d="M8 11L2 5h12z"/></svg>
    </a>
    <div class="drawer-body">
        <h3 class="dp-title">圖例</h3>
        <div class="drawer-legend"></div>
        <h3 class="dp-title">開關</h3>
        <div id="layers"></div>
        <h3 class="dp-title dp-toggle collapsed" id="rail-special-title" data-layer="transit"
            role="button" aria-expanded="false">鐵路特例<span class="chev" aria-hidden="true"></span></h3>
        <div id="rail-special" data-layer="transit" class="collapsed"></div>
        <h3 class="dp-title">功能</h3>
        <div class="drawer-tools">
    <a id="reset" class="button">重置</a>
    <a id="save" class="button">保存成圖片</a>
        </div>
    </div>
</div>
<!-- the page's signature line + the repository link share the bottom-right corner;
     the open panel covers both (see #corner in style.css) -->
<div id="corner">
    <p class="credit">Teoswa-ex © 2026 demoliisher</p>
    <a id="gh" class="gh" href="https://github.com/demoliisher/Teoswa-ex" target="_blank" title="GitHub">
        <svg aria-hidden="true" viewBox="0 0 16 16" width="26" height="26" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
</div>
<div id="output" hidden>
    <div><img></div>
    <p>手機端可長按圖片保存</p>
    <div><a class="button">關閉</a></div>
</div>
<script src="assets/app.js"></script>
</body>
</html>
